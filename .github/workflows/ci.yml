name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot ${{ env.GODOT_VERSION }}-stable
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
      - name: Import project
        run: ./godot --headless --path . --import
      - name: Run tests
        run: ./godot --headless --path . --script res://tests/run_tests.gd
      - name: Run main scene (smoke)
        run: |
          ./godot --headless --path . --fixed-fps 60 --quit-after 240 2>&1 | tee run.log
          grep -q "SceneRouter\] -> res://scenes/menus/main_menu.tscn" run.log
          ! grep -E "^(SCRIPT )?ERROR" run.log
