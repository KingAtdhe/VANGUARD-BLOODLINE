name: Android APK

# Builds a debug-signed test APK and attaches it to a GitHub Release so it
# can be downloaded straight to a phone. Debug signing only: the keystore is
# generated fresh in the runner and never stored. Not for store upload.

on:
  workflow_dispatch:
  push:
    tags: ["m*"]

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download Godot and export templates ${{ env.GODOT_VERSION }}-stable
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && chmod +x godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Debug keystore and editor settings
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          ./godot --headless --quit || true   # creates the editor settings file
          SETTINGS=$(ls "$HOME"/.config/godot/editor_settings-4*.tres | head -n 1)
          cat >> "$SETTINGS" <<EOF
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import and export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          ./godot --headless --path . --import
          mkdir -p build/android
          ./godot --headless --path . --export-debug "Android" build/android/vanguard-bloodline-debug.apk 2>&1 | tee export.log
          test -s build/android/vanguard-bloodline-debug.apk
          ls -la build/android
      - name: Publish to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'config/version="\K[^"]+' project.godot)
          TAG="apk-${VERSION}"
          cp build/android/vanguard-bloodline-debug.apk "vanguard-bloodline-${VERSION}-debug.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Test build ${VERSION} (debug APK)" \
            --notes "Debug-signed test build for sideloading on Android (arm64). Not a store release."
          gh release upload "$TAG" "vanguard-bloodline-${VERSION}-debug.apk" --clobber
